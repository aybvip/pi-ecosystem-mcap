<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ar' }}" dir="{{ page.dir | default: 'rtl' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} | pi-ecosystem-mcap</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
:root{--bg:#0b0d10;--panel:#12161c;--line:#232a34;--fg:#e8edf4;--muted:#97a3b6;--accent:#f7c948;--ok:#4ade80;--warn:#fbbf24;--no:#f87171;--blue:#9ecbff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:16px/1.8 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -10%,#16202b 0%,var(--bg) 60%);padding:0 0 80px}

/* Nav */
nav{background:#0d1117;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
nav a:hover{color:var(--fg)}
nav a.home{color:var(--accent);font-weight:600;font-size:15px}
nav .sep{color:var(--line)}

/* Main layout */
.container{max-width:860px;margin:0 auto;padding:48px 24px}

/* Prose */
h1{font-size:clamp(24px,4vw,40px);margin:0 0 24px;letter-spacing:-.02em;color:var(--fg);border-bottom:1px solid var(--line);padding-bottom:16px}
h2{font-size:20px;margin:48px 0 12px;color:var(--fg);border-bottom:1px solid var(--line);padding-bottom:8px}
h3{font-size:16px;margin:32px 0 8px;color:var(--accent)}
p{color:var(--fg);margin:0 0 16px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
strong{color:var(--fg)}
blockquote{margin:16px 0;padding:12px 16px;border-right:3px solid var(--accent);background:#12161c;border-radius:0 8px 8px 0;color:var(--muted)}
blockquote p{margin:0;color:var(--muted)}

/* Code */
code{background:#1a1f28;color:#e2b96f;padding:2px 6px;border-radius:4px;font-size:13px;font-family:Consolas,Monaco,monospace}
pre{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:18px;overflow-x:auto;margin:20px 0}
pre code{background:none;color:#a8d8a8;padding:0;font-size:13px;line-height:1.6}

/* Tables */
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}
thead{background:#0d1117}
th{padding:10px 14px;border-bottom:2px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:right;font-weight:500}
td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--fg);text-align:right;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#0f141a}

/* Status colors in tables */
td strong{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px}

/* Callouts — bold first word pattern */
.callout{padding:14px 18px;border-radius:10px;margin:20px 0;font-size:14px}

/* Lists */
ul,ol{padding-right:20px;margin:0 0 16px}
li{margin-bottom:6px;color:var(--fg)}
li strong{color:var(--accent)}

/* Horizontal rule */
hr{border:none;border-top:1px solid var(--line);margin:40px 0}

/* Back nav */
.back-bar{margin-bottom:32px;padding:12px 16px;background:#0d1117;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-bar a{color:var(--blue)}

/* Footer */
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:var(--muted)}
</style>
</head>
<body>

<nav>
  <a href="/pi-ecosystem-mcap/" class="home">π ecosystem-mcap</a>
  <span class="sep">›</span>
  <a href="/pi-ecosystem-mcap/docs/CONFIRMED">مؤكد / غير مؤكد</a>
  <a href="/pi-ecosystem-mcap/docs/CASE_CIDI">CiDi Games</a>
  <a href="/pi-ecosystem-mcap/docs/PIDEX">PiDEX</a>
  <a href="/pi-ecosystem-mcap/docs/LIQUIDITY">السيولة</a>
  <a href="/pi-ecosystem-mcap/docs/FIRST_MINUTES">أول 60 ثانية</a>
  <a href="/pi-ecosystem-mcap/docs/OUSD">OUSD</a>
  <a href="/pi-ecosystem-mcap/docs/SOURCES">المصادر</a>
</nav>

<div class="container">
  <div class="back-bar">
    ← <a href="/pi-ecosystem-mcap/">الصفحة الرئيسية</a>
    &nbsp;|&nbsp; {{ page.path }}
  </div>

  {{ content }}

  <footer>
    <span>مستقل غير رسمي • ماشي نصائح مالية • MIT License</span>
    <span><a href="/pi-ecosystem-mcap/DISCLAIMER">DISCLAIMER</a> · <a href="https://github.com/aybvip/pi-ecosystem-mcap">GitHub</a></span>
  </footer>
</div>

</body>
</html>
